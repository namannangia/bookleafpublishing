# Render Blueprint: one web service (Docker) + a managed Postgres.
# Deploy: Render dashboard → New → Blueprint → pick this repo, then set ANTHROPIC_API_KEY.
services:
  - type: web
    name: bookleaf-author-support
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
databases:
  - name: bookleaf-db
    plan: free
